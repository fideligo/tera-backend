services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tera
      POSTGRES_PASSWORD: tera_dev_password
      POSTGRES_DB: tera
    ports:
      - "5434:5432"   # 5434 on the host: 5432/5433 are commonly taken by other local Postgres instances
    volumes:
      - tera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tera -d tera"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    # Secrets come from backend/.env — the same file the host venv, the CLIs and pytest read.
    #
    # Compose's ${VAR} substitution reads a .env beside THIS file, not backend/.env, so it cannot
    # reach the real secret. env_file can. TERA_JWT_SECRET therefore arrives here as the same
    # 64-byte value the host uses, instead of the hardcoded 42-byte string that used to sit below:
    # a token minted by a host process was rejected by the container and vice versa.
    env_file:
      - ./backend/.env
    # These override anything of the same name in env_file, which is what makes the arrangement
    # safe: backend/.env points the database at localhost:5434 (correct from the host, wrong from
    # inside this network), and the value here wins.
    environment:
      TERA_DATABASE_URL: postgresql+psycopg://tera:tera_dev_password@db:5432/tera
      TERA_TEST_DATABASE_URL: postgresql+psycopg://tera:tera_dev_password@db:5432/tera_test
      TERA_ENV: development
      TERA_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Migrations run from empty on every start, so `docker compose up` on a fresh volume gives
    # a working API with no manual step.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  tera_pgdata:
